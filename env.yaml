# Conda alternative to the pip setup.
#
#   conda env create -f env.yaml
#   conda activate mscids-cip-sw03
#
# Conda only provides the interpreter here; the packages themselves come from
# requirements.txt so that the pip and conda routes install identical versions.
name: mscids-cip-sw03
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip
  - pip:
      - -r requirements.txt
